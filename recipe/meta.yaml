{% set name = "vowpalwabbit" %}
{% set version = "9.11.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/VowpalWabbit/vowpal_wabbit/archive/refs/tags/{{ version }}.tar.gz
  sha256: 21352230bf0e4c01fb4da1959a7338e21a3150ca5641eb2328abfc749fd32e77
  patches:
    - 0001-Use-system-dependencies.patch


build:
  number: 0
  skip: true  # [win]
  script:
    - {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cmake >=3.13
    - make
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    - setuptools
    - pybind11
    - libboost-devel
    - zlib
    - spdlog
    - rapidjson
    - fmt
    - eigen
    - string-view-lite
    - armadillo
    - ensmallen
    - sse2neon  # [arm64 or aarch64 or ppc64le]
  run:
    - python
    - zlib
    - spdlog
    - rapidjson
    - fmt
    - eigen

test:
  source_files:
    - python
    - test
  imports:
    - vowpalwabbit
  commands:
    - pip check
    - python -m pytest -sv python/tests/ -k "not test_ccb_and_automl"  # [python_impl == "cpython" and linux64]
  requires:
    - pip
    - pytest
    - pandas
    - numpy
    - scipy
    - scikit-learn
    - vw-executor  # [linux64]

about:
  home: https://github.com/VowpalWabbit/vowpal_wabbit
  summary: Vowpal Wabbit Python package
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jackgerrits
    - gramhagen
    - xhochy
    - ngam
    - byronxu99
